org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Target Minecraft 26.2 exactly.
minecraft_version=26.2
minecraft_version_range=[26.2]
minecraft_label=26.2
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
neo_version=26.2.0.93
# The lowest NeoForge version the mod declares support for: the first NeoForge build for 26.2.
# Verify with: ./gradlew.bat :neoforge:compileJava "-Pneo_version=26.2.0.0-beta"
neo_version_range=[26.2.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

fabric_loader_version=0.19.5
# Minimum Fabric Loader, the one the minimum Fabric API requires.
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.161.0+26.2
# Minimum Fabric API for Minecraft 26.2; its metadata requires Loader 0.18.4 and Java 25.
# Verify with: ./gradlew.bat :fabric:compileJava "-Pfabric_loader_version=0.18.4" "-Pfabric_api_version=0.152.1+26.2"
# Build metadata (+26.2) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.152.1
fabric_minecraft_version_range=26.2

# Forge 65 is the series for Minecraft 26.2.
# Verify the minimum with: ./gradlew.bat :forge:compileJava "-Pforge_version=65.0.0"
# Keep the Forge Minecraft target separate from common/Fabric overrides.
forge_minecraft_version=26.2
forge_version=65.1.5
forge_version_range=[65.0.0,)
forge_loader_version_range=[65,)

# NightConfig is shipped by NeoForge and Forge; the Fabric jar bundles this version.
night_config_version=3.8.0

mod_id=ranchingdispensers
mod_name=Ranching Dispensers
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.ranchingdispensers
