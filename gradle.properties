org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
java_version=17

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Forge. The same jar also runs on NeoForge 1.20.1.
forge_minecraft_version=1.20.1
forge_version=47.4.26
# Minimum: ./gradlew :forge:compileJava "-Pforge_version=47.1.0"
# NeoForge minimum: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.5"
# NeoForge compatibility: ./gradlew :forge:compileJava "-Pneoforge_version=1.20.1-47.1.106"
forge_version_range=[47.1.0,)
forge_loader_version_range=[47,)

fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.14.21
fabric_api_version=0.92.12+1.20.1
# Minimum: ./gradlew :fabric:compileJava "-Pminecraft_version=1.20.1" "-Pfabric_loader_version=0.14.21" "-Pfabric_api_version=0.83.0+1.20.1"
fabric_api_version_range=>=0.83.0
fabric_minecraft_version_range=1.20.1

# Supplied by Forge/NeoForge; Fabric bundles the pinned core and toml jars.
night_config_version=3.6.4

mod_id=ranchingdispensers
mod_name=Ranching Dispensers
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.ranchingdispensers
